<!DOCTYPE html>
<html lang="zh-Hant" style="background:#fff5ef;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#fff5ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅遊積分">
<title>旅遊積分</title>
<style>
  :root{color-scheme:light only;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-text-fill-color:currentColor;-webkit-tap-highlight-color:transparent;}
  html,body{background:#fff5ef !important;}
  body{font-family:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;color:#4a3b35;line-height:1.5;
    padding:14px 12px 40px;max-width:560px;margin:0 auto;-webkit-font-smoothing:antialiased;}
  .top{text-align:center;margin-bottom:4px;}
  .top .eyebrow{font-size:11px;letter-spacing:.2em;color:#f0a04b !important;-webkit-text-fill-color:#f0a04b;font-weight:800;}
  .top h1{font-size:21px;font-weight:900;color:#4a3b35 !important;-webkit-text-fill-color:#4a3b35;}
  .rule{text-align:center;font-size:12px;color:#a08b7e !important;-webkit-text-fill-color:#a08b7e;margin-bottom:6px;}

  .kids{display:flex;gap:12px;margin:12px 0 6px;}
  .kid{flex:1;background:#fff !important;border-radius:22px;padding:16px 12px 14px;border:3px solid #ffe4d6;
    box-shadow:0 4px 14px rgba(240,160,75,.15);cursor:pointer;text-align:center;transition:transform .12s,border-color .15s;position:relative;}
  .kid.active{border-color:var(--kc);transform:translateY(-2px);}
  .kid.active::after{content:"✏️ 加分中";position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    background:var(--kc) !important;color:#fff !important;-webkit-text-fill-color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block;border:3px solid var(--kc);box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .kid .nm{font-size:15px;font-weight:900;color:var(--kc) !important;-webkit-text-fill-color:var(--kc);}
  .kid .sc{font-size:28px;font-weight:900;color:#4a3b35 !important;-webkit-text-fill-color:#4a3b35;line-height:1.1;font-variant-numeric:tabular-nums;}
  .kid .sc small{font-size:12px;color:#a89b88 !important;-webkit-text-fill-color:#a89b88;}

  .prog-wrap{background:#fff !important;border-radius:20px;padding:16px;margin:12px 0 14px;box-shadow:0 4px 14px rgba(240,160,75,.12);}
  .month-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed #ffe0d0;}
  .month-badge{font-size:13px;font-weight:900;color:#f0704b !important;-webkit-text-fill-color:#f0704b;}
  .month-sub{font-size:11px;color:#a08b7e !important;-webkit-text-fill-color:#a08b7e;}
  .goal-switch{display:flex;gap:8px;margin-bottom:12px;}
  .goalchip{flex:1;border:2px solid #ffe0d0;background:#fff !important;border-radius:12px;padding:8px;font-size:13px;font-weight:800;
    cursor:pointer;font-family:inherit;color:#a08b7e !important;-webkit-text-fill-color:#a08b7e;transition:all .12s;}
  .goalchip.on{border-color:var(--kc);background:var(--kc) !important;color:#fff !important;-webkit-text-fill-color:#fff;}
  .prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .prog-goal{font-size:15px;font-weight:900;}
  .prog-rem{font-size:12px;color:#a08b7e !important;-webkit-text-fill-color:#a08b7e;}
  .bar{height:22px;border-radius:14px;background:#ffeadf;overflow:hidden;position:relative;}
  .bar>span{display:block;height:100%;border-radius:14px;background:var(--kc);transition:width .5s cubic-bezier(.2,.9,.3,1);
    background-image:linear-gradient(90deg,rgba(255,255,255,.35) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.35) 50%,rgba(255,255,255,.35) 75%,transparent 75%);background-size:22px 22px;}
  .prog-plane{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:17px;transition:left .5s cubic-bezier(.2,.9,.3,1);}
  .prog-foot{text-align:center;font-size:12px;color:#b0a090 !important;-webkit-text-fill-color:#b0a090;margin-top:9px;}

  .sec-title{font-size:14px;font-weight:900;margin:18px 0 9px;display:flex;align-items:center;gap:7px;color:#4a3b35 !important;-webkit-text-fill-color:#4a3b35;}
  .sec-title .emo{font-size:17px;}
  .sec-title .bar2{width:4px;height:16px;border-radius:3px;background:var(--sc);}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .pbtn{background:#fff !important;border:2px solid #ffe0d0;border-radius:16px;padding:12px 13px;text-align:left;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(240,160,75,.08);transition:transform .1s;}
  .pbtn:active{transform:scale(.94);}
  .pbtn .t{font-size:13px;font-weight:700;color:#4a3b35 !important;-webkit-text-fill-color:#4a3b35;line-height:1.25;}
  .pbtn .p{font-size:16px;font-weight:900;color:var(--sc) !important;-webkit-text-fill-color:var(--sc);white-space:nowrap;}
  .pbtn.neg{border-color:#ffd9d9;background:#fff8f8 !important;}
  .pbtn.big{border-color:#ffddb0;}

  .actions{display:flex;gap:9px;margin:20px 0 6px;}
  .actions button{flex:1;border:none;border-radius:16px;padding:14px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(0,0,0,.08);}
  .btn-custom{background:#ffe9d6 !important;color:#c47a35 !important;-webkit-text-fill-color:#c47a35;}
  .btn-redeem{background:linear-gradient(135deg,#ff9a5a,#f0704b) !important;color:#fff !important;-webkit-text-fill-color:#fff;}
  .btn-log{background:#ffd9e6 !important;color:#c0507a !important;-webkit-text-fill-color:#c0507a;}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#4a3b35 !important;color:#fff !important;-webkit-text-fill-color:#fff;
    padding:13px 24px;border-radius:30px;font-size:15px;font-weight:800;opacity:0;transition:all .25s;pointer-events:none;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.28);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal{position:fixed;inset:0;background:rgba(74,59,53,.45);display:none;align-items:center;justify-content:center;z-index:200;padding:24px;}
  .modal.show{display:flex;}
  .sheet{background:#fff !important;border-radius:24px;padding:24px;width:100%;max-width:360px;box-shadow:0 14px 44px rgba(0,0,0,.3);}
  .sheet h3{font-size:18px;font-weight:900;margin-bottom:10px;color:#4a3b35 !important;-webkit-text-fill-color:#4a3b35;}
  .sheet label{font-size:12px;color:#a08b7e !important;-webkit-text-fill-color:#a08b7e;display:block;margin:10px 0 4px;font-weight:700;}
  .sheet input{width:100%;padding:12px;border:2px solid #ffe0d0;border-radius:12px;font-size:15px;font-family:inherit;background:#fff !important;color:#4a3b35 !important;-webkit-text-fill-color:#4a3b35;}
  .sheet .hint{font-size:13px;color:#8a7a70 !important;-webkit-text-fill-color:#8a7a70;line-height:1.6;}
  .sheet .row{display:flex;gap:10px;margin-top:18px;}
  .sheet .row button{flex:1;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;}
  .cancel{background:#f0eae6 !important;color:#8a7a70 !important;-webkit-text-fill-color:#8a7a70;}
  .confirm{background:linear-gradient(135deg,#ff9a5a,#f0704b) !important;color:#fff !important;-webkit-text-fill-color:#fff;}
  .logitem{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f4ece6;font-size:13px;align-items:center;}
  .logitem .lt{color:#4a3b35 !important;-webkit-text-fill-color:#4a3b35;}
  .logitem .lp{font-weight:900;}
  .logitem .lp.pos{color:#3fa07e !important;-webkit-text-fill-color:#3fa07e;}
  .logitem .lp.neg{color:#e0705f !important;-webkit-text-fill-color:#e0705f;}
  .logitem .ld{color:#c0ab9e !important;-webkit-text-fill-color:#c0ab9e;font-size:11px;}
  .empty{text-align:center;color:#c0ab9e !important;-webkit-text-fill-color:#c0ab9e;font-size:13px;padding:24px;}
  .del{background:none;border:none;color:#e0705f !important;-webkit-text-fill-color:#e0705f;font-size:11px;cursor:pointer;padding:2px 6px;font-weight:700;}
</style>
</head>
<body>
  <div class="top">
    <div class="eyebrow">FAMILY TRAVEL REWARDS</div>
    <h1>✈️ 我們的旅遊積分 🌏</h1>
  </div>
  <div class="rule">做好事加分，存到 3000 分 → 全家出國 ✈️</div>

  <div class="kids" id="kids"></div>
  <div class="prog-wrap" id="prog"></div>
  <div id="menu"></div>

  <div class="actions">
    <button class="btn-custom" onclick="openCustom()">✨ 自訂</button>
    <button class="btn-redeem" onclick="openRedeem()">🎫 兌換</button>
    <button class="btn-log" onclick="openLog()">📖 紀錄</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal" id="m-custom"><div class="sheet">
    <h3>✨ 自訂加分／扣分</h3>
    <label>項目名稱</label><input id="c-name" placeholder="例如：特別獎勵">
    <label>分數（可輸入負數扣分）</label><input id="c-pts" type="number" inputmode="numeric" placeholder="例如：10 或 -5">
    <div class="row"><button class="cancel" onclick="closeModal('m-custom')">取消</button><button class="confirm" onclick="doCustom()">確認</button></div>
  </div></div>

  <div class="modal" id="m-redeem"><div class="sheet">
    <h3 id="redeem-title">🎫 兌換</h3>
    <p class="hint" id="redeem-hint"></p>
    <div class="row"><button class="cancel" onclick="closeModal('m-redeem')">取消</button><button class="confirm" id="redeem-btn" onclick="doRedeem()">兌換</button></div>
  </div></div>

  <div class="modal" id="m-log"><div class="sheet">
    <h3>📖 加分紀錄</h3>
    <div id="loglist" style="max-height:50vh;overflow-y:auto;"></div>
    <div class="row"><button class="cancel" onclick="closeModal('m-log')">關閉</button></div>
  </div></div>

// ---- sound engine (Web Audio, no files) ----
var _ac=null;
function ac(){if(!_ac){try{_ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return _ac;}
function beep(freq,start,dur,type,vol){
  var a=ac();if(!a)return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine";o.frequency.value=freq;
  var t=a.currentTime+start;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);
  o.start(t);o.stop(t+dur+0.02);
}
function sndSmall(){ // 叮 上揚
  beep(880,0,0.12,"sine",0.22);
  beep(1320,0.06,0.14,"sine",0.18);
}
function sndBig(){ // 小勝利樂句 do-mi-so-do
  var n=[523,659,784,1046];
  n.forEach(function(f,i){beep(f,i*0.09,0.16,"triangle",0.22);});
}
function sndMinus(){ // 低沉提醒
  beep(300,0,0.18,"sawtooth",0.16);
  beep(200,0.12,0.22,"sawtooth",0.14);
}
function sndRedeem(){ // 歡呼樂句（較長）
  var n=[523,659,784,1046,784,1046,1318];
  n.forEach(function(f,i){beep(f,i*0.11,0.20,"triangle",0.22);});
  // sparkle tail
  beep(1568,0.8,0.3,"sine",0.15);
}

    +'<div class="bar"><span style="--kc:'+k.color+';width:'+pct+'%"></span><span class="prog-plane" style="left:'+pct+'%">✈️</span></div>'
    +'<div class="prog-foot">'+s+' / '+GOAL+' 分</div>';
  var p=document.getElementById("prog");p.style.setProperty("--kc",k.color);p.innerHTML=h;
}
function setGoal(id){DB.goal=id;save();renderProg();}
function renderMenu(){
  var h="";var dd=DB.dailyDone[DB.active]||{};
  MENU.forEach(function(sec){
    var note=sec.note?('<span style="margin-left:auto;font-size:10px;font-weight:700;color:#b0a090;-webkit-text-fill-color:#b0a090">'+sec.note+'</span>'):'';
    h+='<div class="sec-title" style="--sc:'+sec.color+'"><span class="bar2"></span><span class="emo">'+sec.emo+'</span>'+sec.cat+note+'</div><div class="btns">';
    sec.items.forEach(function(it){
      var nm=it[0].replace(/\'/g,"");
      if(sec.daily){
        var done=dd[nm];
        var cls=done?"pbtn done":"pbtn";
        var right=done?"今天 ✓":"+"+it[1];
        h+='<button class="'+cls+'" style="--sc:'+sec.color+'" onclick="addDaily(\''+nm+'\','+it[1]+')"><span class="t">'+it[0]+'</span><span class="p">'+right+'</span></button>';
      }else{
        var sign=it[1]>=0?"+":"";var cls=it[1]<0?"pbtn neg":(it[1]>=10?"pbtn big":"pbtn");
        h+='<button class="'+cls+'" style="--sc:'+sec.color+'" onclick="addPts(\''+nm+'\','+it[1]+')"><span class="t">'+it[0]+'</span><span class="p">'+sign+it[1]+'</span></button>';
      }
    });
    h+='</div>';});
  document.getElementById("menu").innerHTML=h;
}
function addDaily(name,pts){
  checkDay();var k=DB.active;var dd=DB.dailyDone[k]||(DB.dailyDone[k]={});
  if(dd[name]){toast("這個今天已經加過囉 😊");return;}
  dd[name]=true;addPts(name,pts);
}
function renderAll(){checkMonth();checkDay();renderKids();renderProg();renderMenu();}
function setActive(id){DB.active=id;save();renderAll();}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove("show");},1600);}
function addPts(name,pts){var k=DB.active;DB.scores[k]+=pts;if(DB.scores[k]<0)DB.scores[k]=0;
  if(pts>0){DB.monthEarned[k]=(DB.monthEarned[k]||0)+pts;}
  DB.log.unshift({kid:k,name:name,pts:pts,t:Date.now()});if(DB.log.length>300)DB.log.pop();save();renderAll();
  if(pts<0){sndMinus();}else if(pts>=10){sndBig();}else{sndSmall();}
  var kn=KIDS.find(function(x){return x.id===k;}).name;toast((pts>=0?"🎉 ":"")+kn+" "+(pts>=0?"+":"")+pts+" 分！");}
function openCustom(){document.getElementById("c-name").value="";document.getElementById("c-pts").value="";document.getElementById("m-custom").classList.add("show");}
function doCustom(){var n=document.getElementById("c-name").value.trim()||"自訂";var p=parseInt(document.getElementById("c-pts").value,10);if(isNaN(p)){toast("請輸入分數");return;}closeModal("m-custom");addPts(n,p);}
function openRedeem(){var g=curGoal();document.getElementById("redeem-title").textContent="🎫 兌換："+g.name;
  document.getElementById("redeem-hint").innerHTML="存到 <b>"+g.pts+" 分</b> 就能兌換全家"+g.name+"行！<br>兌換後扣掉 "+g.pts+"，剩下的分數繼續存下一趟。";
  document.getElementById("redeem-btn").textContent="兌換 "+g.name;
  document.getElementById("m-redeem").classList.add("show");}
function doRedeem(){var g=curGoal();var GOAL=g.pts;var k=DB.active;var kn=KIDS.find(function(x){return x.id===k;}).name;
  if(DB.scores[k]<GOAL){closeModal("m-redeem");toast(kn+" 積分還不夠唷！");return;}
  DB.scores[k]-=GOAL;DB.log.unshift({kid:k,name:"兌換 "+g.name,pts:-GOAL,t:Date.now()});save();renderAll();closeModal("m-redeem");sndRedeem();toast("🎉✈️ "+kn+" 兌換 "+g.name+"！");}
function openLog(){var h="";var k=DB.active;var mine=DB.log.filter(function(x){return x.kid===k;});
  if(mine.length===0){h='<div class="empty">還沒有紀錄唷 ✏️</div>';}
  else{mine.forEach(function(e){var idx=DB.log.indexOf(e);var dt=new Date(e.t);var ds=(dt.getMonth()+1)+"/"+dt.getDate();
    h+='<div class="logitem"><div><span class="lt">'+e.name+'</span> <span class="ld">'+ds+'</span></div><div><span class="lp '+(e.pts>=0?"pos":"neg")+'">'+(e.pts>=0?"+":"")+e.pts+'</span> <button class="del" onclick="delLog('+idx+')">刪</button></div></div>';});}
  document.getElementById("loglist").innerHTML=h;document.getElementById("m-log").classList.add("show");}
function delLog(idx){var e=DB.log[idx];if(!e)return;
  DB.scores[e.kid]-=e.pts;if(DB.scores[e.kid]<0)DB.scores[e.kid]=0;
  if(e.pts>0){DB.monthEarned[e.kid]=Math.max(0,(DB.monthEarned[e.kid]||0)-e.pts);}
  // free up the daily item if it was one (so it can be re-added today)
  if(DB.dailyDone[e.kid]&&DB.dailyDone[e.kid][e.name]){delete DB.dailyDone[e.kid][e.name];}
  DB.log.splice(idx,1);save();renderAll();openLog();}
function closeModal(id){document.getElementById(id).classList.remove("show");}
document.querySelectorAll(".modal").forEach(function(m){m.addEventListener("click",function(e){if(e.target===m)m.classList.remove("show");});});
// unlock audio on first user interaction (mobile requirement)
function _unlock(){var a=ac();if(a&&a.state==="suspended"){a.resume();}document.removeEventListener("touchstart",_unlock);document.removeEventListener("click",_unlock);}
document.addEventListener("touchstart",_unlock,{once:false});
document.addEventListener("click",_unlock,{once:false});
renderAll();
</script>
</body>
</html>
